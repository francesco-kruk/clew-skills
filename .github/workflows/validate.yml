name: Validate skills

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Published full SHA for remote consumer smoke tests (defaults to this run's SHA)
        required: false
        type: string

permissions:
  contents: read

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: s
    steps:
      - uses: actions/checkout@v4
        with:
          path: s
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use short project-local Windows scratch paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci-scratch | Out-Null
          $scratch = (Resolve-Path .ci-scratch).Path
          "TEMP=$scratch" >> $env:GITHUB_ENV
          "TMP=$scratch" >> $env:GITHUB_ENV
      - name: Install pinned toolchain
        run: python -m pip install -r requirements-dev.txt -r skills/content-ingest/requirements.txt -r skills/course-content/requirements.txt
      - name: Confirm APM release
        run: apm --version
      - name: Synthetic course contract tests
        run: python -m unittest discover -s skills/course-content/tests -q
      - name: Synthetic ingestion tests
        run: python -m unittest discover -s skills/content-ingest/tests -q
      - name: Restore committed maintainer environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: apm install --frozen --target copilot,agent-skills
      - name: Check generated deployment drift
        run: git diff --exit-code -- .agents

  consumers:
    needs: synthetic
    # PR merge SHAs may not be fetchable through package APIs; test published heads.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned toolchain
        run: python -m pip install -r requirements-dev.txt
      - name: Clean teacher and student installs plus frozen restores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
        run: python scripts/apm_smoke_consumers.py --repo "$REPOSITORY" --sha "$REVISION"
      - name: Preserve actual locks and smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apm-consumer-results
          include-hidden-files: true
          path: |
            .apm-smoke/**/apm.yml
            .apm-smoke/**/apm.lock.yaml
            .apm-smoke/**/smoke-result.json
